<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GROWVANCE — Services Note 5 แบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
/* ===== Demo page chrome ===== */
.intro{max-width:1240px;margin:0 auto;padding:40px 32px 24px}
.intro h1{margin:0 0 8px;font:700 28px/1.3 Prompt;color:#0b1f45}
.intro p{margin:0 0 16px;color:#4a5878;line-height:1.7}
.intro nav{display:flex;flex-wrap:wrap;gap:8px}
.intro nav a{padding:6px 14px;border-radius:999px;background:#fff;border:1px solid #d9e1f0;color:#0b1f45;font:500 14px Prompt;text-decoration:none}
.intro nav a:hover{border-color:#1d4fd8;color:#1d4fd8}
.demo-label{max-width:1240px;margin:0 auto;padding:40px 32px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.demo-label b{font:700 20px Prompt;color:#0b1f45}
.demo-label span{color:#4a5878;font-size:15px;flex:1 1 320px}
.demo-wrap .services{padding-top:56px;border-top:1px solid #e3e8f2}
@media (max-width:640px){.intro,.demo-label{padding-left:16px;padding-right:16px}}

/* ===== Shared note bits ===== */
.sn{margin-top:40px;color:#0b1f45}
.sn svg{flex:none}
.sn b{font-family:Prompt;font-weight:600}
.play .sn{animation:reveal-up .8s var(--ease-out) .65s both}

/* 1 — Inline note bar */
.sn1{display:flex;align-items:center;gap:14px;padding:16px 22px;border-radius:16px;background:#f3f7ff;border:1px solid #dbe6ff;font-size:15px;line-height:1.65}
.sn1-icon{width:36px;height:36px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;flex:none}
.sn1 b{color:#1d4fd8;margin-right:6px}

/* 2 — Navy split card */
.sn2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:28px;align-items:center;padding:30px 34px;border-radius:22px;background:radial-gradient(120% 140% at 0% 0%,#163a82,#0b1f45 60%);color:#fff;box-shadow:0 20px 44px rgba(11,31,69,.22)}
.sn2-kicker{display:flex;align-items:center;gap:8px;font:600 13px Prompt;color:#f2c14e;margin-bottom:6px}
.sn2-kicker::before{content:'';width:20px;height:2px;border-radius:2px;background:#f2c14e}
.sn2-title{font:700 22px/1.4 Prompt}
.sn2-points{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0;padding:0;list-style:none}
.sn2-points li{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.9)}
.sn2-points svg{width:38px;height:38px;padding:9px;border-radius:12px;background:#f2c14e;color:#0b1f45}
@media (max-width:860px){.sn2{grid-template-columns:1fr;padding:26px 22px}.sn2-points{grid-template-columns:1fr}}

/* 3 — Gold-accent callout */
.sn3{position:relative;display:flex;gap:18px;align-items:flex-start;padding:24px 28px 24px 30px;border-radius:18px;background:#fffaf0;border:1px solid #f6e3b4;overflow:hidden}
.sn3::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#f2c14e}
.sn3-icon{width:46px;height:46px;border-radius:14px;background:#f2c14e;color:#0b1f45;display:grid;place-items:center;flex:none;transform:rotate(-6deg)}
.sn3-title{font:600 17px/1.45 Prompt;margin-bottom:4px}
.sn3 p{margin:0;color:#5a6788;font-size:15px;line-height:1.7}
.sn3 p b{color:#0b1f45}

/* 4 — Money-flow steps */
.sn4{padding:26px 28px;border-radius:22px;border:1px dashed #c9d5ee;background:#fbfcff}
.sn4-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:18px}
.sn4-head b{font-size:18px}
.sn4-head span{color:#5a6788;font-size:14px}
.sn4-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:12px;margin:0;padding:0;list-style:none}
.sn4-step{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid #e3e8f2;box-shadow:0 8px 20px rgba(11,31,69,.05);font-size:14px;line-height:1.5}
.sn4-step svg{width:40px;height:40px;padding:9px;border-radius:50%;background:#eaf0fe;color:#2563eb}
.sn4-step.is-you svg{background:#f2c14e;color:#0b1f45}
.sn4-step small{display:block;color:#5a6788;font-size:12.5px}
.sn4-arrow{color:#f2c14e}
@media (max-width:860px){.sn4-flow{grid-template-columns:1fr}.sn4-arrow{justify-self:center;transform:rotate(90deg)}}

/* 5 — Centered pill badges */
.sn5{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.sn5-label{font:600 13px Prompt;color:#5a6788;letter-spacing:.3px}
.sn5-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.sn5-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:999px;background:#fff;border:1px solid #e3e8f2;box-shadow:0 10px 26px rgba(11,31,69,.07);font:500 15px Prompt}
.sn5-pill svg{width:30px;height:30px;padding:6px;border-radius:50%;background:#0b1f45;color:#f2c14e}

@media (max-width:640px){.sn1,.sn3{padding:18px}.sn1{align-items:flex-start}.sn5-pill{border-radius:18px;text-align:left}}
</style>
</head>
<body>

<header class="intro">
  <h1>หมายเหตุท้าย Services — 5 แบบ</h1>
  <p>req รูปที่ 2 ข้อ 4: ดันจุดขายเรื่องงบโฆษณาโปร่งใส · วางไว้ใต้การ์ดบริการ 4 ใบก่อนจบ section (การ์ดด้านบนดึงมาจากหน้าเว็บจริง)</p>
  <nav><a href="#n1">1 Inline Note</a><a href="#n2">2 Navy Split</a><a href="#n3">3 Gold Callout</a><a href="#n4">4 Money Flow</a><a href="#n5">5 Pill Badges</a></nav>
</header>

<main id="variants"></main>

<script>
const ICON = {
  card: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
  chart: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  shield: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  ads: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>',
  arrow: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'
};

const variants = [
  {name: 'Inline Note', desc: 'แถบหมายเหตุบรรทัดเดียว เรียบ เบา ไม่แย่งซีนการ์ด',
   html: `<div class="sn sn1"><span class="sn1-icon">${ICON.shield}</span><p><b>งบโฆษณาโปร่งใส</b>ลูกค้าชำระค่าโฆษณาผ่านบัตรของตนเองโดยตรง พร้อมรับรายงานยอดใช้จ่ายรายวัน</p></div>`},
  {name: 'Navy Split', desc: 'การ์ดสีกรมเข้มตัดกับการ์ดขาว หัวข้อซ้าย จุดขาย 2 ข้อขวา — เด่นที่สุด',
   html: `<div class="sn sn2"><div><div class="sn2-kicker">งบโฆษณาโปร่งใส</div><div class="sn2-title">เงินค่าโฆษณาของคุณ<br>ตรวจสอบได้ทุกวัน</div></div>
     <ul class="sn2-points"><li>${ICON.card}<span>ลูกค้าชำระค่าโฆษณาผ่าน<b>บัตรของตนเองโดยตรง</b></span></li><li>${ICON.chart}<span>รับ<b>รายงานยอดใช้จ่ายรายวัน</b> เห็นทุกบาทที่ใช้ไป</span></li></ul></div>`},
  {name: 'Gold Callout', desc: 'กล่องหมายเหตุพื้นครีม ขอบซ้ายสีทอง ดูเป็น “ข้อควรรู้” ที่อ่านง่าย',
   html: `<div class="sn sn3"><span class="sn3-icon">${ICON.shield}</span><div><div class="sn3-title">หมายเหตุ: งบโฆษณาโปร่งใสทุกบาท</div><p>ลูกค้าชำระค่าโฆษณาผ่าน<b>บัตรของตนเองโดยตรง</b> พร้อมรับ<b>รายงานยอดใช้จ่ายรายวัน</b></p></div></div>`},
  {name: 'Money Flow', desc: 'แสดงเส้นทางเงินเป็น 3 ขั้น ให้เห็นภาพว่าเงินจ่ายตรงจากบัตรลูกค้า',
   html: `<div class="sn sn4"><div class="sn4-head"><b>งบโฆษณาโปร่งใส</b><span>ลูกค้าชำระค่าโฆษณาผ่านบัตรของตนเองโดยตรง พร้อมรับรายงานยอดใช้จ่ายรายวัน</span></div>
     <ol class="sn4-flow"><li class="sn4-step is-you">${ICON.card}<span><b>บัตรของคุณ</b><small>ผูกกับบัญชีโฆษณาโดยตรง</small></span></li><li class="sn4-arrow" aria-hidden="true">${ICON.arrow}</li>
     <li class="sn4-step">${ICON.ads}<span><b>แพลตฟอร์มโฆษณา</b><small>Google · Meta · TikTok</small></span></li><li class="sn4-arrow" aria-hidden="true">${ICON.arrow}</li>
     <li class="sn4-step">${ICON.chart}<span><b>รายงานถึงคุณทุกวัน</b><small>สรุปยอดใช้จ่ายรายวัน</small></span></li></ol></div>`},
  {name: 'Pill Badges', desc: 'ป้ายแคปซูล 2 อันตรงกลาง กระชับที่สุด เหมือนตราการันตี',
   html: `<div class="sn sn5"><span class="sn5-label">งบโฆษณาโปร่งใส ตรวจสอบได้</span><div class="sn5-pills"><span class="sn5-pill">${ICON.card}ชำระค่าโฆษณาผ่านบัตรของคุณเองโดยตรง</span><span class="sn5-pill">${ICON.chart}รับรายงานยอดใช้จ่ายรายวัน</span></div></div>`}
];

fetch('../../index.html').then(r => r.text()).then(html => {
  const src = new DOMParser().parseFromString(html, 'text/html').getElementById('services');
  const root = document.getElementById('variants');
  variants.forEach((v, i) => {
    const n = i + 1;
    const wrap = document.createElement('div');
    wrap.className = 'demo-wrap';
    wrap.innerHTML = `<div class="demo-label" id="n${n}"><b>แบบที่ ${n} · ${v.name}</b><span>${v.desc}</span></div>`;
    const sec = src.cloneNode(true);
    sec.removeAttribute('id');
    sec.querySelectorAll('img[src^="assets/"]').forEach(img => img.src = '../../' + img.getAttribute('src'));
    sec.querySelector('.container').insertAdjacentHTML('beforeend', v.html);
    wrap.append(sec);
    root.append(wrap);
  });
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('play'); io.unobserve(e.target); }
  }), {threshold: .15});
  document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
});
</script>
</body>
</html>
