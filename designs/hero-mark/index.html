<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GROWVANCE — Hero Highlight 5 แบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
/* ===== Demo page chrome ===== */
.intro{max-width:1240px;margin:0 auto;padding:40px 32px 24px}
.intro h1{margin:0 0 8px;font:700 28px/1.3 Prompt;color:#0b1f45}
.intro p{margin:0 0 16px;color:#4a5878;line-height:1.7}
.intro nav{display:flex;flex-wrap:wrap;gap:8px}
.intro nav a{padding:6px 14px;border-radius:999px;background:#fff;border:1px solid #d9e1f0;color:#0b1f45;font:500 14px Prompt;text-decoration:none}
.intro nav a:hover{border-color:#1d4fd8;color:#1d4fd8}
.mk-label{max-width:1240px;margin:0 auto;padding:36px 32px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.mk-label b{font:700 20px Prompt;color:#0b1f45}
.mk-label span{color:#4a5878;font-size:15px;flex:1 1 320px}
.mk-label button{font:500 14px Prompt;padding:6px 14px;border-radius:999px;border:1px solid #1d4fd8;background:#fff;color:#1d4fd8;cursor:pointer}
.mk-label button:hover{background:#1d4fd8;color:#fff}
@media (max-width:640px){.intro,.mk-label{padding-left:16px;padding-right:16px}}

/* ===== Shared reset: drop the solid gold block from style.css ===== */
.mk .hero-title mark{position:relative;isolation:isolate;display:inline-block;margin:0 .06em;padding:0;border-radius:0;background:none;color:inherit;animation:none}
.mk .hero-title .d3 mark{margin-left:.06em}
.mk-svg{position:absolute;z-index:-1;overflow:visible;pointer-events:none}
.mk-svg path{fill:none;stroke:#f2c14e;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.play .mk-svg path{animation:mk-draw .9s var(--ease-out) .9s both}
.play .d3 .mk-svg path{animation-delay:1.3s}
@keyframes mk-draw{from{stroke-dashoffset:1}}

/* 1 — Brush underline: gold text + hand-drawn swoosh */
.mk1 .hero-title mark{color:#ffd772}
.mk1 .mk-svg{left:-3%;width:106%;bottom:-.02em;height:.32em}
.mk1 .mk-svg path{stroke-width:7}

/* 2 — Gradient shimmer: gold → light-blue text with a soft glow */
.mk2 .hero-title mark{padding:.12em 0;margin-block:-.12em;color:transparent;background:linear-gradient(100deg,#f2c14e 0%,#ffe9a8 22%,#7cc4ff 45%,#f2c14e 70%,#ffe9a8 100%) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(242,193,78,.35));animation:mk-shimmer 5s linear infinite}
.mk2.play .hero-title mark{animation:mk-fade .8s var(--ease-out) .85s both,mk-shimmer 5s linear 1.6s infinite}
@keyframes mk-shimmer{to{background-position:-220% 0}}
@keyframes mk-fade{from{opacity:0;filter:blur(8px)}}

/* 3 — Soft marker: translucent, tilted half-highlight behind white text */
.mk3 .hero-title mark{color:#fff}
.mk3 .hero-title mark::before{content:'';position:absolute;z-index:-1;left:-.12em;right:-.12em;bottom:.14em;height:.32em;background:linear-gradient(90deg,#f2c14e,#f7d277 70%,rgba(247,210,119,.6));border-radius:.4em .15em .45em .2em;transform:rotate(-1.6deg) skewX(-10deg);transform-origin:left center}
.play.mk3 .hero-title mark::before{animation:mk-sweep .7s var(--ease-out) .9s both}
.play.mk3 .hero-title .d3 mark::before{animation-delay:1.3s}
@keyframes mk-sweep{from{transform:rotate(-1.6deg) skewX(-10deg) scaleX(0)}}

/* 4 — Hand-drawn circle around the word */
.mk4 .hero-title mark{color:#ffd772;margin:0 .4em 0 .36em}
.mk4 .mk-svg{left:-.4em;top:.02em;width:calc(100% + .8em);height:calc(100% + .02em)}
.mk4 .mk-svg path{stroke-width:3.5}
.mk4.play .mk-svg path{animation-duration:1.1s}

/* 5 — Glow + sparkle: gold text, soft halo, twinkling stars */
.mk5 .hero-title mark{color:#ffd772;text-shadow:0 0 24px rgba(242,193,78,.55)}
.mk5 .hero-title mark::before{content:'';position:absolute;z-index:-1;inset:15% -10% 10%;border-radius:50%;background:radial-gradient(closest-side,rgba(242,193,78,.32),rgba(242,193,78,0));filter:blur(6px)}
.mk-spark{position:absolute;width:.42em;height:.42em;fill:#ffe9a8;pointer-events:none;animation:mk-twinkle 2.4s ease-in-out infinite}
.mk-spark.s1{top:.02em;right:-.34em}
.mk-spark.s2{width:.24em;height:.24em;bottom:.22em;left:-.26em;animation-delay:1.2s}
.play.mk5 .hero-title mark{animation:mk-pop .8s var(--ease-out) .85s both}
.play.mk5 .hero-title .d3 mark{animation-delay:1.25s}
@keyframes mk-twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes mk-pop{from{opacity:0;transform:scale(.85);text-shadow:none}}

@media (prefers-reduced-motion:reduce){.mk-spark{animation:none}}
</style>
</head>
<body>

<header class="intro">
  <h1>Hero Highlight — 5 แบบ</h1>
  <p>แทนที่กล่องเหลืองทึบเดิมด้วยการเน้นคำที่นุ่มขึ้น ใช้ข้อความ, การ์ด glass และพื้นหลัง Hero จริงของเว็บ · animation เล่นเมื่อเลื่อนมาถึง กด “เล่นซ้ำ” เพื่อดูอีกครั้ง</p>
  <nav><a href="#v1">1 Brush Underline</a><a href="#v2">2 Gradient Shimmer</a><a href="#v3">3 Soft Marker</a><a href="#v4">4 Hand-drawn Circle</a><a href="#v5">5 Glow + Sparkle</a></nav>
</header>

<template id="hero-tpl">
  <div class="hero">
    <section class="hero-grid">
      <div class="hero-copy glass a-pop" data-hero>
        <div class="hero-eyebrow a-slide d0"><span class="dot"></span>บริการรับทำ Google Ads ครบวงจร</div>
        <h2 class="hero-title">
          <span class="row a-slide d1">รับทำ <mark>Google Ads</mark></span>
          <span class="row a-slide d2">โดยทีมผู้เชี่ยวชาญ</span>
          <span class="row a-slide d3">วัดผลได้<mark>ทุกบาท</mark></span>
        </h2>
        <p class="hero-text a-slide d4">ดูแล Google Ads ครบทุกขั้น ทั้ง Search, Performance Max และ YouTube พร้อมติดตั้งการวัดผลและส่งรายงานที่อ่านเข้าใจง่ายทุกเดือน ให้คุณรู้ว่าเงินโฆษณาสร้างยอดขายได้เท่าไร</p>
        <ul class="hero-chips a-slide d5"><li>Google Search</li><li>Performance Max</li><li>YouTube Ads</li><li>GA4 / Tag Manager</li></ul>
        <div class="hero-actions a-slide d6">
          <div class="hero-contact">
            <a href="#" class="btn btn-icon btn-hero hero-call">โทร 062-646-6246 <span class="btn-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></span></a>
            <a href="#" class="hero-cta hero-cta-line"><img src="../../assets/img/line-cta.webp" alt="" width="24" height="23" class="line-cta-icon">LINE @growvance</a>
          </div>
        </div>
      </div>
    </section>
  </div>
</template>

<main id="variants"></main>

<script>
const variants = [
  {name: 'Brush Underline', desc: 'ตัวอักษรสีทอง มีเส้นพู่กันโค้งลากใต้คำ ดูเป็นลายมือ อ่านง่ายที่สุด',
   svg: '<svg class="mk-svg" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M3 13 C 45 6, 115 3, 197 9"/></svg>'},
  {name: 'Gradient Shimmer', desc: 'ตัวอักษรไล่สีทอง → ฟ้า มีแสงวิ่งผ่านช้า ๆ ดูพรีเมียม ทันสมัย'},
  {name: 'Soft Marker', desc: 'ปากกาไฮไลต์โปร่งแสงครึ่งล่างของคำ เอียงเล็กน้อย ตัวอักษรยังเป็นสีขาว — ใกล้แบบเดิมแต่นุ่มกว่า'},
  {name: 'Hand-drawn Circle', desc: 'วงกลมลายมือวาดล้อมคำ ดูเป็นกันเอง เหมือนวงคำสำคัญด้วยปากกา',
   svg: '<svg class="mk-svg" viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M34 72 C 8 66, 0 40, 14 24 C 40 2, 150 0, 184 14 C 204 26, 202 56, 172 68 C 130 82, 56 80, 18 66 C 4 58, 2 44, 8 34"/></svg>'},
  {name: 'Glow + Sparkle', desc: 'ตัวอักษรสีทองเรืองแสงนุ่ม ๆ มีประกายดาวกะพริบเบา ๆ ดูมีชีวิตชีวา',
   svg: '<svg class="mk-spark s1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z"/></svg><svg class="mk-spark s2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z"/></svg>'}
];

const tpl = document.getElementById('hero-tpl');
const root = document.getElementById('variants');

variants.forEach((v, i) => {
  const n = i + 1;
  const label = document.createElement('div');
  label.className = 'mk-label';
  label.id = 'v' + n;
  label.innerHTML = `<b>แบบที่ ${n} · ${v.name}</b><span>${v.desc}</span><button type="button">↻ เล่นซ้ำ</button>`;
  const frag = tpl.content.cloneNode(true);
  const card = frag.querySelector('[data-hero]');
  card.classList.add('mk', 'mk' + n);
  if (v.svg) card.querySelectorAll('mark').forEach(m => m.insertAdjacentHTML('beforeend', v.svg));
  label.querySelector('button').addEventListener('click', () => {
    card.classList.remove('play');
    void card.offsetWidth;
    card.classList.add('play');
  });
  root.append(label, frag);
});

const io = new IntersectionObserver(entries => entries.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('play'); io.unobserve(e.target); }
}), {threshold: .35});
document.querySelectorAll('[data-hero]').forEach(el => io.observe(el));
</script>
</body>
</html>
